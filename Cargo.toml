[package]
name = "pdf-cleanroom"
version = "0.1.0"
edition = "2024"
description = "PDF document sanitization tool — detect and remove secrets from PDF files"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lopdf = "0.34"
printpdf = "0.7"
